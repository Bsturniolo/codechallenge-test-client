name: Complexity

on:
  push:
    branches: [main]
  pull_request:

jobs:
  xenon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Complejidad ciclomática (xenon)
        run: xenon --max-absolute A --max-modules A --max-average A bot run.py
